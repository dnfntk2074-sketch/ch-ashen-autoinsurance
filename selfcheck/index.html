<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>보험 셀프체크 | 강북본부</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;background:#eef6ff;color:#102447}.app{max-width:680px;margin:auto;padding:16px 14px 48px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.back{text-decoration:none;color:#2563eb;font-weight:850;font-size:13px}.brand{font-size:12px;font-weight:900;color:#3e7fca}.hero,.card{background:#fff;border:1px solid #dbe7f5;border-radius:24px;padding:20px;margin-bottom:14px;box-shadow:0 10px 28px rgba(48,94,148,.07)}.hero h1{font-size:30px;line-height:1.15;margin:8px 0}.hero p,.desc{color:#6c7f98;font-size:14px;line-height:1.6}.tag{display:inline-block;padding:6px 10px;background:#eaf3ff;color:#1f67c9;border-radius:999px;font-size:11px;font-weight:900}.title{font-size:20px;font-weight:900;margin:8px 0 12px}.grid{display:grid;gap:9px}.choice{border:1.5px solid #dbe2ec;background:#fff;border-radius:15px;padding:14px;font-weight:800;color:#274564;text-align:left}.choice.sel{border-color:#1769e0;background:#eef5ff}.progress{height:7px;background:#dfe8f4;border-radius:99px;overflow:hidden}.progress div{height:100%;background:#1769e0}.row{display:flex;gap:9px}.row>*{flex:1}.btn{width:100%;border:0;border-radius:14px;padding:15px;font-weight:900;background:#1769e0;color:#fff}.btn.ghost{background:#edf3fb;color:#37516f}.hidden{display:none!important}.bars{display:grid;gap:9px}.bar{display:grid;grid-template-columns:90px 1fr 55px;gap:8px;align-items:center;font-size:12px}.track{height:12px;background:#edf2f7;border-radius:99px;overflow:hidden}.track span{display:block;height:100%;background:#1769e0}.footer{text-align:center;font-size:11px;color:#8292a7;padding:14px}</style></head><body><div class="app"><div class="top"><a class="back" href="../">← 강북본부 TOOLBOX</a><span class="brand">SELF CHECK · 강북본부</span></div><section class="hero"><span class="tag">12 QUESTIONS</span><h1>보험료 · 보장 · 계약관리<br>한 번에 셀프체크</h1><p>증권이 없어도 시작할 수 있습니다. 결과에서 가장 낮은 영역을 먼저 확인하세요.</p></section><section class="card"><div class="progress"><div id="bar"></div></div><div id="qbox"></div><div class="row" style="margin-top:14px"><button id="prev" class="btn ghost">이전</button><button id="next" class="btn">다음</button></div></section><section id="result" class="card hidden"></section><div class="footer">A+에셋 · 강북본부</div></div><script>const qs=[['보험료','가족 전체 보험료가 월 소득 대비 부담되지 않는 수준인가요?'],['보험료','비슷한 보장을 중복으로 여러 개 내고 있지 않나요?'],['보험료','갱신형 보험료가 앞으로 얼마나 오를지 알고 있나요?'],['보험료','보험료를 줄여도 꼭 필요한 보장은 유지할 수 있나요?'],['보장','암·뇌·심장 진단 및 치료비가 충분한가요?'],['보장','수술·입원·간병·재활 등 치료 이후 비용도 준비돼 있나요?'],['보장','실손 외에 정액형 수술·치료비 보장을 알고 있나요?'],['보장','운전자·자동차·화재 등 생활위험 보장도 점검했나요?'],['계약관리','보험금 청구 방법과 담당자를 알고 있나요?'],['계약관리','최근 2년 안에 증권 전체를 한 번이라도 점검했나요?'],['계약관리','수익자·계약자·납입방법 등 계약관계를 확인했나요?'],['계약관리','가족 상황 변화에 맞춰 보험을 조정한 적이 있나요?']];let s=0,a=Array(12).fill(null);function r(){if(s>=12)return done();bar.style.width=((s+1)/12*100)+'%';qbox.innerHTML=`<span class="tag">${qs[s][0]}</span><div class="title">${s+1}. ${qs[s][1]}</div><div class="grid">${[['예',2],['잘 모르겠어요',1],['아니요',0]].map(([v,n])=>`<button class="choice ${a[s]&&a[s][0]===v?'sel':''}" data-v="${v}" data-n="${n}">${v}</button>`).join('')}</div>`;qbox.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{a[s]=[b.dataset.v,+b.dataset.n];r()});prev.style.visibility=s===0?'hidden':'visible';next.disabled=!a[s];next.textContent=s===11?'결과 보기':'다음'}prev.onclick=()=>{if(s>0){s--;r()}};next.onclick=()=>{if(a[s]){s++;r()}};function done(){document.querySelector('.card').classList.add('hidden');result.classList.remove('hidden');const sum={보험료:0,보장:0,계약관리:0},cnt={보험료:0,보장:0,계약관리:0};qs.forEach((q,i)=>{sum[q[0]]+=a[i][1];cnt[q[0]]++});const p={};Object.keys(sum).forEach(k=>p[k]=Math.round(sum[k]/(cnt[k]*2)*100));const low=Object.keys(p).sort((x,y)=>p[x]-p[y])[0];result.innerHTML=`<span class="tag">RESULT</span><div class="title">가장 먼저 볼 영역: ${low}</div><div class="bars">${Object.keys(p).map(k=>`<div class="bar"><b>${k}</b><div class="track"><span style="width:${p[k]}%"></span></div><strong>${p[k]}점</strong></div>`).join('')}</div><p class="desc">오늘 결과는 방향 확인입니다. 정확한 원인은 보험증권을 함께 봐야 알 수 있습니다.</p><button class="btn ghost" onclick="location.reload()">다시 체크</button>`}r()</script></body></html>
