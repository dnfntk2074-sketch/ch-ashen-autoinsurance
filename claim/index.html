<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1769e0"><title>놓친 보험금 찾기 | 강북본부</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;background:linear-gradient(180deg,#eaf5ff,#f8fbff 42%,#eef6ff);color:#102447}.app{max-width:680px;margin:auto;min-height:100vh;padding:16px 14px 48px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}.back{text-decoration:none;color:#2563eb;font-size:13px;font-weight:850}.brand{font-size:12px;font-weight:900;color:#3e7fca;letter-spacing:.08em}.hero,.card{background:#fff;border:1px solid #dbe7f5;border-radius:24px;padding:20px;box-shadow:0 10px 28px rgba(48,94,148,.07);margin-bottom:14px}.hero h1{font-size:31px;line-height:1.12;letter-spacing:-.05em;margin:8px 0 10px}.hero p,.desc{color:#6c7f98;line-height:1.65;font-size:14px}.tag{display:inline-block;padding:6px 10px;border-radius:999px;background:#eaf3ff;color:#1f67c9;font-size:11px;font-weight:900}.title{font-size:20px;font-weight:900;letter-spacing:-.03em;margin-bottom:8px}.grid{display:grid;gap:9px}.choice{border:1.5px solid #dbe2ec;background:#fff;border-radius:15px;padding:14px 13px;text-align:left;font-size:14px;font-weight:800;color:#274564;cursor:pointer}.choice.sel{border-color:#1769e0;background:#eef5ff;box-shadow:inset 0 0 0 1px #1769e0}.progress{height:7px;background:#dfe8f4;border-radius:99px;overflow:hidden;margin:10px 0 16px}.progress>div{height:100%;background:#1769e0}.row{display:flex;gap:9px}.row>*{flex:1}.btn{width:100%;border:0;border-radius:14px;padding:15px 14px;font-size:15px;font-weight:900;background:#1769e0;color:#fff;cursor:pointer}.btn.ghost{background:#edf3fb;color:#37516f}.list{margin:8px 0 0;padding-left:18px;color:#5d6d81;font-size:13px;line-height:1.75}.hidden{display:none!important}.mini,.footer{font-size:11px;color:#8594a7;line-height:1.5}.footer{text-align:center;padding:14px 0}</style></head><body><div class="app"><div class="top"><a class="back" href="../">← 강북본부 TOOLBOX</a><span class="brand">CLAIM CHECK · 강북본부</span></div><section class="hero"><span class="tag">10 EASY QUESTIONS</span><h1>혹시 놓친 보험금이<br>있는지 확인해볼까요?</h1><p>보험증권 없이도 됩니다. 쉬운 질문 10개에 답하면 지급을 확정하는 것이 아니라 <b>확인해볼 항목</b>을 정리해드립니다.</p></section><section class="card"><div class="progress"><div id="bar" style="width:10%"></div></div><div id="qbox"></div><div class="row" style="margin-top:14px"><button id="prev" class="btn ghost">이전</button><button id="next" class="btn">다음</button></div></section><section id="result" class="card hidden"></section><div class="footer">A+에셋 · 강북본부</div></div><script>const qs=[["실손만 청구하고 수술비·입원비는 따로 확인하지 않은 적이 있나요?","수술·입원 정액담보 확인"],["최근 3년 안에 입원하거나 수술한 적이 있나요?","입원·수술 관련 담보 확인"],["골절·깁스·화상 치료를 받은 적이 있나요?","골절·깁스·화상 진단·치료 담보 확인"],["건강검진에서 용종 제거 또는 조직검사를 받은 적이 있나요?","수술·질병수술 담보 확인"],["암·뇌·심장 관련 정밀검사나 치료를 받은 적이 있나요?","진단·치료비 관련 담보 확인"],["응급실이나 중환자실을 이용한 적이 있나요?","응급실·중환자실 담보 확인"],["간병인 또는 재활치료를 이용한 적이 있나요?","간병·재활 관련 담보 확인"],["치과·안과·이비인후과 등에서 수술성 치료를 받은 적이 있나요?","질병·상해 수술비 확인"],["회사 단체보험이 있지만 개인보험과 함께 확인해본 적이 없나요?","단체보험 중복·보완 확인"],["예전에 가입한 보험이 무엇을 보장하는지 잘 모르시나요?","계약 전체 조회 및 보장분석"]];let step=0,a=Array(10).fill('');function render(){if(step>=10)return done();bar.style.width=((step+1)*10)+'%';qbox.innerHTML=`<div class="title">${step+1}. ${qs[step][0]}</div><div class="desc">가장 가까운 답을 선택하세요.</div><div class="grid">${['네','아니요','잘 모르겠어요'].map(v=>`<button class="choice ${a[step]===v?'sel':''}" data-v="${v}">${v}</button>`).join('')}</div>`;qbox.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{a[step]=b.dataset.v;render()});prev.style.visibility=step===0?'hidden':'visible';next.disabled=!a[step];next.textContent=step===9?'결과 보기':'다음'}prev.onclick=()=>{if(step>0){step--;render()}};next.onclick=()=>{if(a[step]){step++;render()}};function done(){document.querySelector('.card').classList.add('hidden');result.classList.remove('hidden');const items=[];a.forEach((v,i)=>{if(v==='네'||v==='잘 모르겠어요')items.push(qs[i][1])});result.innerHTML=`<span class="tag">RESULT</span><div class="title" style="margin-top:10px">확인해볼 항목 ${items.length}개</div><div class="desc">결과 개수가 많다고 보험금을 많이 받을 수 있다는 뜻은 아닙니다. 지급 여부는 가입계약·진단명·치료내용·약관·보험회사 심사에 따라 달라집니다.</div><ul class="list">${items.length?items.map(x=>`<li>${x}</li>`).join(''):'<li>현재 답변 기준으로 우선 확인 항목이 많지 않습니다.</li>'}</ul><div class="grid" style="margin-top:16px"><a class="btn" style="text-decoration:none;text-align:center" href="https://cont.insure.or.kr/cont_web/intro.do" target="_blank">내보험찾아줌 공식 조회 →</a><button class="btn ghost" id="sms">결과 문자로 보내기</button><button class="btn ghost" onclick="location.reload()">처음부터 다시</button></div><p class="mini">사이트에는 입력정보를 저장하지 않습니다. 공식 조회와 실제 보험금 청구는 고객 본인이 직접 진행합니다.</p>`;sms.onclick=()=>{location.href='sms:?&body='+encodeURIComponent('[강북본부 놓친 보험금 찾기] 확인 항목: '+(items.join(', ')||'우선 확인 항목 적음'))}}render();</script></body></html>
