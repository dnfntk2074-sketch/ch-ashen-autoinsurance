<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1769e0"><title>실손보험금 계산 | 강북본부</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;background:linear-gradient(180deg,#eaf5ff,#f8fbff 42%,#eef6ff);color:#102447}.app{max-width:680px;margin:auto;min-height:100vh;padding:16px 14px 48px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}.back{text-decoration:none;color:#2563eb;font-size:13px;font-weight:850}.brand{font-size:12px;font-weight:900;color:#3e7fca;letter-spacing:.08em}.hero,.card{background:#fff;border:1px solid #dbe7f5;border-radius:24px;padding:20px;box-shadow:0 10px 28px rgba(48,94,148,.07);margin-bottom:14px}.hero h1{font-size:31px;line-height:1.12;letter-spacing:-.05em;margin:8px 0 10px}.hero p{color:#6c7f98;line-height:1.65;font-size:14px}.tag{display:inline-block;padding:6px 10px;border-radius:999px;background:#eaf3ff;color:#1f67c9;font-size:11px;font-weight:900}.row{display:flex;gap:9px}.row>*{flex:1}.field{margin-bottom:12px}.field label{display:block;font-size:13px;font-weight:800;color:#526987;margin-bottom:6px}.field input,.field select{width:100%;min-height:46px;border:1px solid #cfe0f1;border-radius:13px;padding:0 12px;background:#fbfdff;font-size:15px;color:#102447}.btn{width:100%;border:0;border-radius:14px;padding:15px 14px;font-size:15px;font-weight:900;background:#1769e0;color:#fff}.result{background:linear-gradient(135deg,#0d63ea,#268ef6);color:#fff;border-radius:20px;padding:19px;margin-top:14px}.result h2{margin:0 0 8px;font-size:26px}.mini,.footer{font-size:11px;color:#8594a7;line-height:1.5}.footer{text-align:center;padding:14px 0}</style></head><body><div class="app"><div class="top"><a class="back" href="../">← 강북본부 TOOLBOX</a><span class="brand">SILSON CHECK · 강북본부</span></div><section class="hero"><span class="tag">1~5세대 상담용</span><h1>실손보험금<br>예상 계산</h1><p>가입 세대와 진료비를 입력하면 예상 자기부담액과 보험금 범위를 계산합니다. 실제 지급액은 약관과 보험사 심사에 따라 달라질 수 있습니다.</p></section><section class="card"><div class="field"><label>가입 세대</label><select id="gen"><option>1세대</option><option>2세대</option><option selected>3세대</option><option>4세대</option><option>5세대</option></select></div><div class="field"><label>진료 구분</label><select id="type"><option>통원</option><option>입원</option></select></div><div class="row"><div class="field"><label>급여 진료비</label><input id="covered" type="number" value="300000"></div><div class="field"><label>비급여 진료비</label><input id="noncovered" type="number" value="170000"></div></div><div class="row"><div class="field"><label>급여 자기부담률(%)</label><input id="cr" type="number" value="20"></div><div class="field"><label>비급여 자기부담률(%)</label><input id="nr" type="number" value="30"></div></div><button class="btn" id="calc">예상 보험금 계산</button><div id="out"></div><p class="mini">세대별 세부 공제금액·최소공제·특약구조는 상품 및 가입시기에 따라 다를 수 있어 자기부담률은 직접 수정할 수 있게 했습니다.</p></section><div class="footer">A+에셋 · 강북본부</div></div><script>const n=id=>Math.max(0,parseFloat(document.getElementById(id).value)||0);function run(){const c=n('covered'),nc=n('noncovered'),cr=n('cr')/100,nr=n('nr')/100;const self=c*cr+nc*nr,pay=Math.max(0,c+nc-self);out.innerHTML=`<div class="result"><h2>${Math.round(pay).toLocaleString()}원</h2><p>예상 보험금</p><div class="row"><div><b>총 진료비</b><br>${Math.round(c+nc).toLocaleString()}원</div><div><b>예상 자기부담</b><br>${Math.round(self).toLocaleString()}원</div></div></div>`}calc.onclick=run;gen.onchange=()=>{const g=gen.value;if(g==='1세대'){cr.value=0;nr.value=0}else if(g==='2세대'){cr.value=10;nr.value=20}else if(g==='3세대'||g==='4세대'){cr.value=20;nr.value=30}else{cr.value=20;nr.value=50}run()};run();</script></body></html>
