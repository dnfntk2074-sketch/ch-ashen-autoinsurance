<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>백지설계 LIFE GRAPH | 강북본부</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;background:#eef6ff;color:#102447}.app{max-width:680px;margin:auto;padding:16px 14px 48px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.back{text-decoration:none;color:#2563eb;font-weight:850;font-size:13px}.brand{font-size:12px;font-weight:900;color:#3e7fca}.hero,.card{background:#fff;border:1px solid #dbe7f5;border-radius:24px;padding:20px;margin-bottom:14px;box-shadow:0 10px 28px rgba(48,94,148,.07)}.hero h1{font-size:30px;line-height:1.15;margin:8px 0}.hero p{color:#6c7f98;font-size:14px;line-height:1.6}.tag{display:inline-block;padding:6px 10px;background:#eaf3ff;color:#1f67c9;border-radius:999px;font-size:11px;font-weight:900}.title{font-size:20px;font-weight:900;margin:8px 0 12px}.row{display:flex;gap:9px}.row>*{flex:1}.field{margin-bottom:12px}.field label{display:block;font-size:13px;font-weight:800;color:#526987;margin-bottom:6px}.field input{width:100%;min-height:46px;border:1px solid #cfe0f1;border-radius:13px;padding:0 12px;background:#fbfdff;font-size:15px}.btn{width:100%;border:0;border-radius:14px;padding:15px;font-weight:900;background:#1769e0;color:#fff}.result{background:linear-gradient(135deg,#0d63ea,#268ef6);color:#fff;border-radius:20px;padding:19px;margin-top:14px}.result h2{margin:0 0 8px;font-size:25px}.bars{display:grid;gap:9px;margin-top:14px}.bar{display:grid;grid-template-columns:105px 1fr 70px;gap:8px;align-items:center;font-size:12px}.track{height:12px;background:#edf2f7;border-radius:99px;overflow:hidden}.track span{display:block;height:100%;background:linear-gradient(90deg,#5ab7ff,#1769e0)}.mini,.footer{font-size:11px;color:#8292a7;line-height:1.5}.footer{text-align:center;padding:14px}</style></head><body><div class="app"><div class="top"><a class="back" href="../">← 강북본부 TOOLBOX</a><span class="brand">LIFE GRAPH · 강북본부</span></div><section class="hero"><span class="tag">LIFE PLANNING</span><h1>가족의 시간과 돈을<br>한눈에</h1><p>가족 구성·현금흐름·목적자금·은퇴 시점을 입력해 부족 구간을 빠르게 확인합니다.</p></section><section class="card"><div class="title">현재 현금흐름</div><div class="row"><div class="field"><label>월 소득(만원)</label><input id="income" type="number" value="930"></div><div class="field"><label>월 지출(만원)</label><input id="expense" type="number" value="550"></div></div><div class="row"><div class="field"><label>현재 나이</label><input id="age" type="number" value="47"></div><div class="field"><label>1차 은퇴 나이</label><input id="retire" type="number" value="65"></div></div><div class="field"><label>현재 금융자산(만원)</label><input id="asset" type="number" value="8000"></div><div class="title">주요 목적자금</div><div class="row"><div class="field"><label>교육·독립자금(만원)</label><input id="edu" type="number" value="8000"></div><div class="field"><label>주택·목돈(만원)</label><input id="goal" type="number" value="10000"></div></div><div class="field"><label>은퇴 준비 목표(만원)</label><input id="retgoal" type="number" value="30000"></div><button class="btn" id="calc">LIFE GRAPH 보기</button><div id="out"></div></section><div class="footer">A+에셋 · 강북본부</div></div><script>const n=id=>Math.max(0,parseFloat(document.getElementById(id).value)||0);function draw(){const surplus=Math.max(0,n('income')-n('expense')),years=Math.max(0,n('retire')-n('age')),future=n('asset')+surplus*12*years,needs=n('edu')+n('goal')+n('retgoal'),gap=future-needs;const vals=[['현재 금융자산',n('asset')],['은퇴 전 예상 누적',future],['목적자금 합계',needs]],max=Math.max(...vals.map(v=>v[1]),1);out.innerHTML=`<div class="result"><h2>${gap>=0?'준비 여력 '+Math.round(gap).toLocaleString()+'만원':'부족 예상 '+Math.round(-gap).toLocaleString()+'만원'}</h2><p>현재 단순 현금흐름 기준 예상치입니다.</p></div><div class="bars">${vals.map(([k,v])=>`<div class="bar"><b>${k}</b><div class="track"><span style="width:${v/max*100}%"></span></div><strong>${Math.round(v).toLocaleString()}</strong></div>`).join('')}</div><p class="mini">수익률·물가·세금·소득변동은 반영하지 않은 상담용 단순 시각화입니다.</p>`}calc.onclick=draw;draw()</script></body></html>
